# From it-env/templates/container-image/release-flows/ (see ../README.md there).
name: refresh release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even if non-Dependabot commits are unreleased
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=origin/release
          authors=$(git log --format='%an' "$last..HEAD")
          if [ -z "$authors" ]; then
            echo "Nothing since $last."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$FORCE" != true ] && echo "$authors" | grep -v -x -e 'dependabot\[bot\]' -e 'github-actions\[bot\]' | grep -q .; then
            echo "::notice::Unreleased non-Dependabot commits since $last; ship them with your next normal release."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.go == 'true'
        run: |
          read -r major minor patch <<<"$(sed -nE 's/^version = "([0-9]+)\.([0-9]+)\.([0-9]+)"/\1 \2 \3/p' pyproject.toml | head -1)"
          new="$major.$minor.$((patch + 1))"
          sed -i -E "0,/^version = \".*\"/s//version = \"$new\"/" pyproject.toml
          grep -m1 '^version' pyproject.toml
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release($VERSION): dependency refresh"
          git push origin HEAD:"$GITHUB_REF_NAME"
          git push origin HEAD:release
          gh workflow run ci.yaml --ref release
